name: Refresh metrics

on:
  schedule:
    - cron: "17 11 * * *"   # once a day, 11:17 UTC
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [master]
    paths:
      - scripts/**
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - run: python scripts/metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/metrics-*.svg
          git diff --cached --quiet || (git commit -m "Refresh metrics" && git push)
