<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plate"><path d="M300 40 H900 Q930 40 930 70 V250 Q930 300 880 320 L620 350 Q600 352 580 350 L320 320 Q270 300 270 250 V70 Q270 40 300 40 Z"/></clipPath>
  </defs>
  <rect width="1200" height="360" fill="#0D0D0D"/>
