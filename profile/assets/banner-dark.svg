    <text x="600" y="232" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="30" letter-spacing="4" fill="#FF5F00">MX</text>
    <text x="600" y="305" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="34" letter-spacing="10" fill="#111">ERAGON.MX</text>
